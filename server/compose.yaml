services:
  agro-sync:
    build: .
    restart: unless-stopped
    environment:
      MOLIDO_DB_PATH: /data/molido.sqlite3
      MOLIDO_JWT_SECRET: ${MOLIDO_JWT_SECRET:?Set MOLIDO_JWT_SECRET in the environment}
      MOLIDO_DATA_KEY: ${MOLIDO_DATA_KEY:?Set MOLIDO_DATA_KEY in the environment}
      MOLIDO_TOKEN_TTL_SECONDS: "${MOLIDO_TOKEN_TTL_SECONDS:-1209600}"
      MOLIDO_MAX_LOGIN_FAILURES: "${MOLIDO_MAX_LOGIN_FAILURES:-5}"
      MOLIDO_LOGIN_LOCKOUT_SECONDS: "${MOLIDO_LOGIN_LOCKOUT_SECONDS:-900}"
      MOLIDO_AUTH_RATE_LIMIT: "${MOLIDO_AUTH_RATE_LIMIT:-60}"
      MOLIDO_LOGIN_RATE_LIMIT: "${MOLIDO_LOGIN_RATE_LIMIT:-20}"
      MOLIDO_TRUST_PROXY_HEADERS: "${MOLIDO_TRUST_PROXY_HEADERS:-0}"
      MOLIDO_ADMIN_TOKEN: "${MOLIDO_ADMIN_TOKEN:-}"
      MOLIDO_METRICS_TOKEN: "${MOLIDO_METRICS_TOKEN:-}"
    volumes:
      - agro_sync_data:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  agro_sync_data:
