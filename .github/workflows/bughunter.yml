name: Molido BugHunter Auto Diagnostics
on:
  workflow_dispatch:
    inputs:
      apply_safe_fixes:
        description: Allow Ruff fixes limited to server Python files
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 2 * * *'
  pull_request:
    branches: [main]
  push:
    branches: [feature/bughunter-autofix-agent]
permissions:
  contents: read
concurrency:
  group: bughunter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Install optional safe fixer
        run: python -m pip install ruff
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run BugHunter
        id: bughunter
        continue-on-error: true
        env:
          APPLY_SAFE_FIXES: ${{ inputs.apply_safe_fixes || 'false' }}
        run: |
          set -euo pipefail
          args=(--report-dir artifacts/bughunter)
          if [[ "$APPLY_SAFE_FIXES" == "true" ]]; then args+=(--apply-safe-fixes); fi
          python scripts/bughunter_agent.py "${args[@]}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molido-bughunter-${{ github.run_number }}
          path: artifacts/bughunter/
          if-no-files-found: error
          retention-days: 30
      - name: Mark failing diagnostics
        if: steps.bughunter.outcome == 'failure'
        run: exit 1
