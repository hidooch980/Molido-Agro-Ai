name: Molido BugHunter Auto Diagnostics
on:
  workflow_dispatch:
    inputs:
      apply_safe_fixes:
        description: Allow Ruff fixes limited to server Python files
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 2 * * *'
  pull_request:
    branches: [foundation/android-release-foundation]
  push:
    branches: [feature/bughunter-autofix-agent]
permissions:
  contents: write
concurrency:
  group: bughunter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Install optional safe fixer
        run: python -m pip install ruff
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run BugHunter
        id: bughunter
        continue-on-error: true
        env:
          APPLY_SAFE_FIXES: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.apply_safe_fixes == true }}
        run: |
          set -euo pipefail
          args=(--report-dir artifacts/bughunter)
          if [[ "$APPLY_SAFE_FIXES" == "true" ]]; then args+=(--apply-safe-fixes); fi
          python scripts/bughunter_agent.py "${args[@]}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molido-bughunter-${{ github.run_number }}
          path: artifacts/bughunter/
          if-no-files-found: error
          retention-days: 30
      - name: Mark failing diagnostics
        if: steps.bughunter.outcome == 'failure'
        run: exit 1

      - name: Commit verified safe Python fixes
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/bughunter-autofix-agent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(python - <<'PY'
          import json
          from pathlib import PurePosixPath
          report = json.load(open("artifacts/bughunter/bughunter-report.json", encoding="utf-8"))
          fixes = report.get("safe_fixes", {})
          if report.get("overall") != "passed" or fixes.get("status") != "completed":
              raise SystemExit(0)
          files = fixes.get("changed_files", [])
          for name in files:
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts or not path.parts or path.parts[0] != "server" or path.suffix != ".py":
                  raise SystemExit("Refusing to stage an out-of-scope path: " + name)
          print("\\n".join(sorted(set(files))))
          PY
          )
          if (( ${#changed_files[@]} > 0 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${changed_files[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "chore(bughunter): apply tested safe Python fixes [skip ci]"
              git push origin HEAD:feature/bughunter-autofix-agent
            fi
          fi
