name: Android Release Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, foundation/android-release-foundation]
  workflow_dispatch:

# Build and PR code receive read-only repository permissions.
permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:

  server-tests:
    name: Test self-hosted sync API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run API authentication, isolation, idempotency and conflict tests
        working-directory: server
        env:
          MOLIDO_JWT_SECRET: ci-only-test-secret-with-more-than-32-characters
          MOLIDO_DB_PATH: /tmp/molido-ci.sqlite3
        run: pytest -q
      - name: Build self-hosted API container image
        run: docker build --pull -t molido-agro-sync:ci server
      - name: Smoke-test self-hosted API container and sensor routes
        shell: bash
        env:
          MOLIDO_JWT_SECRET: ci-only-test-secret-with-more-than-32-characters
          MOLIDO_DATA_KEY: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg
        run: |
          set -Eeuo pipefail
          docker run -d --rm --name molido-agro-api-ci \
            -e MOLIDO_JWT_SECRET="$MOLIDO_JWT_SECRET" \
            -e MOLIDO_DATA_KEY="$MOLIDO_DATA_KEY" \
            -p 127.0.0.1:18080:8080 molido-agro-sync:ci
          cleanup() { docker stop molido-agro-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:18080/openapi.json", timeout=5) as response:
              schema = json.load(response)
          required = {
              "/v1/sensors/readings",
              "/v1/sensors/greenhouses/{greenhouse_id}/readings",
              "/v1/sensors/greenhouses/{greenhouse_id}/thresholds",
              "/v1/sensors/greenhouses/{greenhouse_id}/status",
              "/v1/crm/customers",
              "/v1/erp/suppliers",
              "/v1/erp/products",
              "/v1/erp/inventory/movements",
              "/v1/erp/inventory/balances",
              "/v1/erp/sales/orders",
              "/v1/erp/purchase/orders",
              "/v1/erp/finance/entries",
              "/v1/crm-erp/summary",
              "/v1/crm/leads",
              "/v1/crm/activities",
              "/v1/crm/opportunities",
              "/v1/crm/tickets",
              "/v1/crm/tickets/{ticket_id}/status",
              "/v1/erp/orders/{order_id}/transition",
              "/v1/erp/accounting/journals",
              "/v1/erp/accounting/trial-balance",
              "/v1/erp/ledger/accounts",
              "/v1/erp/ledger/journals",
              "/v1/erp/ledger/journals/{journal_id}/approve",
              "/v1/erp/reports/financial",
              "/v1/erp/settlements",
              "/v1/erp/harvest",
              "/v1/erp/greenhouse/harvests",
          }
          missing = required.difference(schema.get("paths", {}))
          if missing:
              raise SystemExit(f"Sensor routes missing from container: {sorted(missing)}")
          print("Container health, sensor, CRM pipeline, order lifecycle, accounting, settlement and harvest routes verified.")
          PY

  android-instrumented-tests:
    name: Android migration tests on emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # GitHub-hosted Linux VMs may not expose KVM; explicitly permit QEMU TCG fallback.
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 1200
          disable-animations: true
          script: bash .github/scripts/run-android-instrumentation.sh

      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          timeout 15s adb devices -l > "$RUNNER_TEMP/molido-adb-devices.txt" 2>&1 || true
          timeout 20s adb logcat -d -v threadtime > "$RUNNER_TEMP/molido-emulator-logcat.txt" 2>&1 || true
          timeout 20s adb shell dumpsys activity processes > "$RUNNER_TEMP/molido-emulator-processes.txt" 2>&1 || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/molido-emulator-logcat.txt
            ${{ runner.temp }}/molido-emulator-processes.txt
            ${{ runner.temp }}/molido-adb-devices.txt
            ${{ runner.temp }}/molido-instrumentation-gradle.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  android-pr-validation:
    name: Android debug validation (no signing secrets)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/foundation/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build unsigned debug APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
        run: gradle --no-daemon --stacktrace -PSYNC_BASE_URL="${SYNC_BASE_URL:-}" :app:testDebugUnitTest :app:assembleDebug
      - name: Upload unsigned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: molido-agro-ai-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  assemble-release:
    name: Assemble Android APK
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate stable release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use stable SemVer format vMAJOR.MINOR.PATCH (for example v1.0.0)."
            exit 1
          fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests and debug build
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
        run: gradle --no-daemon --stacktrace -PSYNC_BASE_URL="${SYNC_BASE_URL:-}" :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare and validate the single release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Release signing is mandatory. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/molido-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore-list.txt"
          if ! grep -Fq "$KEY_ALIAS" "$RUNNER_TEMP/keystore-list.txt"; then
            echo "::error::The configured alias was not found in the PKCS12 keystore."
            exit 1
          fi
          keytool -certreq -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/molido-signing-check.csr" >/dev/null
          rm -f "$RUNNER_TEMP/molido-signing-check.csr"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Assemble release APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
        run: gradle --no-daemon --stacktrace -PSYNC_BASE_URL="${SYNC_BASE_URL:-}" :app:assembleRelease

      - name: Verify APK signature and certificate identity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_DIR="app/build/outputs/apk/release"
          test -s "$DEBUG_APK"
          APK="$(find "$RELEASE_DIR" -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature-verification.txt"
          # minSdk is 26: V2 and V3 are the required schemes for every supported Android version.
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apk-signature-verification.txt"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apk-signature-verification.txt"
          grep -Fq "Number of signers: 1" "$RUNNER_TEMP/apk-signature-verification.txt"
          EXPECTED_CERT_SHA256="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          ACTUAL_CERT_SHA256="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature-verification.txt" | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          cp "$APK" molido-agro-ai.apk
          sha256sum "$DEBUG_APK" molido-agro-ai.apk

      - name: Upload CI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: molido-agro-ai-apk-${{ github.run_number }}
          path: molido-agro-ai.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-tests, android-instrumented-tests, assemble-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: molido-agro-ai-apk-${{ github.run_number }}
          path: dist

      - name: Require signed APK artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/molido-agro-ai.apk

      - name: Create update manifest
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          SHA="$(sha256sum molido-agro-ai.apk | awk '{print $1}')"
          export VERSION VERSION_CODE SHA
          python3 - <<'PY'
          import json, os
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump({
                  "versionName": os.environ["VERSION"],
                  "versionCode": int(os.environ["VERSION_CODE"]),
                  "apkFile": "molido-agro-ai.apk",
                  "sha256": os.environ["SHA"],
                  "releaseNotesUrl": "https://github.com/hidooch980/Molido-Agro-Ai/releases"
              }, f, ensure_ascii=False, indent=2)
          PY

      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/molido-agro-ai.apk
            dist/latest.json
          generate_release_notes: true
