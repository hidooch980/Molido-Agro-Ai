name: Android Release Build

on:
  push:
    branches: [foundation/android-release-foundation]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Build and PR code receive read-only repository permissions.
permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  server-tests:
    name: Test self-hosted sync API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run API authentication, isolation, idempotency and conflict tests
        working-directory: server
        env:
          MOLIDO_JWT_SECRET: ci-only-test-secret-with-more-than-32-characters
          MOLIDO_DB_PATH: /tmp/molido-ci.sqlite3
        run: pytest -q
      - name: Build self-hosted API container image
        run: docker build --pull -t molido-agro-sync:ci server

  android-instrumented-tests:
    name: Android migration tests on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          adb devices -l
          adb logcat -d -v threadtime > "$RUNNER_TEMP/molido-emulator-logcat.txt" 2>&1
          adb shell dumpsys activity processes > "$RUNNER_TEMP/molido-emulator-processes.txt" 2>&1

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/molido-emulator-logcat.txt
            ${{ runner.temp }}/molido-emulator-processes.txt
          if-no-files-found: ignore
          retention-days: 7

  assemble-release:
    name: Assemble Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests and debug build
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
        run: gradle --no-daemon --stacktrace -PSYNC_BASE_URL="${SYNC_BASE_URL:-}" :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare and validate signing key (when configured)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] && [ -z "${KEYSTORE_PASSWORD:-}" ] && [ -z "${KEY_ALIAS:-}" ] && [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Signing secrets not configured; non-release builds remain unsigned."
            exit 0
          fi
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Signing secrets are incomplete. All four Android signing secrets must be configured."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/molido-release.p12"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          if ! keytool -list -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore-list.txt" 2> "$RUNNER_TEMP/keystore-error.txt"; then
            echo "::error::PKCS12 could not be opened. Diagnostic output follows; no secret values are printed."
            sed -n '1,12p' "$RUNNER_TEMP/keystore-list.txt" || true
            sed -n '1,12p' "$RUNNER_TEMP/keystore-error.txt" || true
            file "$KEYSTORE" || true
            wc -c "$KEYSTORE" || true
            exit 1
          fi
          if ! grep -Fq "$KEY_ALIAS" "$RUNNER_TEMP/keystore-list.txt"; then
            echo "::error::PKCS12 opened, but the configured alias was not found."
            grep -E '^[[:space:]]*[^,]+, ' "$RUNNER_TEMP/keystore-list.txt" | head -n 10 || true
            exit 1
          fi
          # PKCS12 private-key password must also unlock the selected alias.
          if ! keytool -certreq -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/molido-signing-check.csr" \
            >/dev/null 2> "$RUNNER_TEMP/key-password-error.txt"; then
            echo "::error::The private-key password or alias is invalid for this PKCS12 keystore."
            sed -n '1,8p' "$RUNNER_TEMP/key-password-error.txt" || true
            exit 1
          fi
          rm -f "$RUNNER_TEMP/molido-signing-check.csr"
          echo "PKCS12 store password, private-key password, and alias validated."
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
        run: gradle --no-daemon --stacktrace -PSYNC_BASE_URL="${SYNC_BASE_URL:-}" :app:assembleRelease

      - name: Verify APK and signing state
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_DIR="app/build/outputs/apk/release"
          test -s "$DEBUG_APK"
          APK="$(find "$RELEASE_DIR" -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            "$APKSIGNER" verify --verbose "$APK"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            cp "$APK" molido-agro-ai.apk
            "$APKSIGNER" verify --print-certs molido-agro-ai.apk
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            cp "$APK" molido-agro-ai-unsigned.apk
          fi
          sha256sum "$DEBUG_APK" *.apk

      - name: Require signing for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${{ steps.verify.outputs.signed }}" = "true"

      - name: Upload CI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: molido-agro-ai-apk-${{ github.run_number }}
          path: |
            molido-agro-ai.apk
            molido-agro-ai-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-tests, android-instrumented-tests, assemble-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: molido-agro-ai-apk-${{ github.run_number }}
          path: dist

      - name: Require signed APK artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/molido-agro-ai.apk
          test ! -e dist/molido-agro-ai-unsigned.apk

      - name: Create update manifest
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          SHA="$(sha256sum molido-agro-ai.apk | awk '{print $1}')"
          export VERSION VERSION_CODE SHA
          python3 - <<'PY'
          import json, os
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump({
                  "versionName": os.environ["VERSION"],
                  "versionCode": int(os.environ["VERSION_CODE"]),
                  "apkFile": "molido-agro-ai.apk",
                  "sha256": os.environ["SHA"],
                  "releaseNotesUrl": "https://github.com/hidooch980/Molido-Agro-Ai/releases"
              }, f, ensure_ascii=False, indent=2)
          PY

      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/molido-agro-ai.apk
            dist/latest.json
          generate_release_notes: true
