name: Android Release Build

"on":
  push:
    # main is intentionally excluded until the Android source is merged there.
    branches: [foundation/android-release-foundation]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    name: Assemble Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare and validate signing key (when configured)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing secrets not configured; non-release builds remain unsigned."
            exit 0
          fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Signing secrets are incomplete. Configure the keystore password and key alias."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/molido-release.p12"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          if ! keytool -list -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The P12 file, store password, or key alias is invalid. Verify the GitHub Actions secrets; no secret values were printed."
            exit 1
          fi
          echo "P12 container and configured alias validated."
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APK and signing state
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_DIR="app/build/outputs/apk/release"
          test -s "$DEBUG_APK"
          APK="$(find "$RELEASE_DIR" -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if "$APKSIGNER" verify --verbose "$APK"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            cp "$APK" molido-agro-ai.apk
            "$APKSIGNER" verify --print-certs molido-agro-ai.apk
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            cp "$APK" molido-agro-ai-unsigned.apk
          fi
          sha256sum "$DEBUG_APK" *.apk

      - name: Require signing for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${{ steps.verify.outputs.signed }}" = "true"

      - name: Upload CI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: molido-agro-ai-apk-${{ github.run_number }}
          path: |
            molido-agro-ai.apk
            molido-agro-ai-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          SHA="$(sha256sum molido-agro-ai.apk | awk '{print $1}')"
          export VERSION VERSION_CODE SHA
          python3 - <<'PY'
          import json, os
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump({
                  "versionName": os.environ["VERSION"],
                  "versionCode": int(os.environ["VERSION_CODE"]),
                  "apkFile": "molido-agro-ai.apk",
                  "sha256": os.environ["SHA"],
                  "releaseNotesUrl": "https://github.com/hidooch980/Molido-Agro-Ai/releases"
              }, f, ensure_ascii=False, indent=2)
          PY

      - name: Publish signed GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            molido-agro-ai.apk
            latest.json
          generate_release_notes: true
